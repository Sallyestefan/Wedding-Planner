<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Wedding Book</title>

  <!-- Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">

  <!-- Our styles: colors, fonts, spacing -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--
  ================================================================
  OUR WEDDING BOOK
  ================================================================
  This page is split into these files:

    index.html             the page structure (this file)
    css/style.css          colors, fonts and spacing
    js/firebase-config.js  which Firebase database to save to
    js/config.js           YOUR SETTINGS: lists and form fields  <- edit this most
    js/app.js              the logic that makes it all work

  See README.md for setup and step-by-step examples.
  ================================================================
-->

  <!-- ======================= LAYOUT =======================
       Computers: sidebar on the left, page on the right.
       Phones: the sidebar's sections become a bar at the bottom. -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">Our Wedding Book</div>

    <button class="couple" type="button" data-action="edit-settings" aria-label="Edit wedding details">
      <span class="avatar" id="couple-initials">♡</span>
      <span class="couple-text"><b id="couple-names">Our wedding</b><small id="couple-days"></small></span>
    </button>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="overview" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Overview</span></button>

      <p class="nav-group">Invite</p>
      <button class="tab" role="tab" data-tab="guests" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>
        <span>Guests</span><i class="count num" id="count-guests"></i></button>

      <p class="nav-group">Prepare</p>
      <button class="tab" role="tab" data-tab="budget" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.6-.6-3-1.6M12 6v2M12 16v2"/></svg>
        <span>Budget</span></button>
      <button class="tab" role="tab" data-tab="vendors" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>
        <span>Vendors</span><i class="count num" id="count-vendors"></i></button>
      <button class="tab" role="tab" data-tab="checklist" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l2 2 3.5-3.5M4 14.5l2 2 3.5-3.5M13 7h7M13 15h7"/></svg>
        <span>Checklist</span><i class="count num" id="count-tasks"></i></button>
    </nav>

    <div class="sidebar-foot">
      <button class="side-link" type="button" data-action="edit-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Wedding details</button>
    </div>
  </aside>

  <div class="main">
    <!-- Only shown on phones -->
    <header class="topbar">
      <span class="monogram" id="monogram">Our Wedding Book</span>
      <button class="icon-btn" id="details-btn" data-action="edit-settings" type="button">Wedding details</button>
    </header>

    <div id="notice"></div>
    <main id="view"></main>
    <p class="footer-note" id="footer-note"></p>
  </div>

  <dialog class="sheet" id="sheet"><div class="sheet-inner" id="sheet-body"></div></dialog>
  <div class="toast" id="toast" hidden></div>

  <!-- Firebase (database and sign-in) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Our scripts: the settings files must load before app.js -->
  <script src="js/firebase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
